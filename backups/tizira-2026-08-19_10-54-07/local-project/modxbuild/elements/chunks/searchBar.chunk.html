<div class="tz-command" id="tz-search">
<div class="tz-command__box">
<div class="tz-command__icon" aria-hidden="true"><i class="fa fa-search"></i></div>
<div id="jobokay_search_container" class="tz-command__body">
<form action="/vacancy" method="get" name="jobsearchForm" id="adminForm" class="tz-command__form">
<div id="filter-bar" class="tz-command__fields">
<div class="tz-command__field">
<label class="tz-command__label" for="filter_jobcategory">Категория</label>
<select name="filter_jobcategory" id="filter_jobcategory" class="tz-command__input">
<option value="">Все категории</option>
<option value="2">Административный персонал</option>
<option value="3">Бухгалтерия, управленческий учет, финансы предприятия</option>
<option value="4">Высший менеджмент</option>
<option value="5">Домашний персонал</option>
<option value="22">Закупки</option>
<option value="28">Инженерно-технические специальности, производство</option>
<option value="7">Информационные технологии, интернет, телеком</option>
<option value="10">Маркетинг, реклама, PR</option>
<option value="11">Медицина, фармацевтика</option>
<option value="13">Начало карьеры, студенты</option>
<option value="14">Продажи, работа с клиентами</option>
<option value="15">Производство, промышленность, рабочий персонал</option>
<option value="25">Секретари, помощники руководителя, переводчики</option>
<option value="6">Сервис</option>
<option value="16">Спортивные клубы, фитнес, салоны красоты</option>
<option value="17">Строительство, недвижимость</option>
<option value="18">Транспорт, логистика, склады</option>
<option value="20">Управление персоналом, тренинги</option>
<option value="21">Юристы</option>
</select>
</div>
<div class="tz-command__field">
<label class="tz-command__label" for="filter_joblocation">Город</label>
<select name="filter_joblocation" id="filter_joblocation" class="tz-command__input">
<option value="">Все города</option>
<option value="Зеленоград">Зеленоград</option>
<option value="Москва">Москва</option>
<option value="Московская область, д. Брёхово">Московская область, д. Брёхово</option>
<option value="Мытищи">Мытищи</option>
<option value="Солнечногорск">Солнечногорск</option>
<option value="Химки">Химки</option>
</select>
</div>
<div class="tz-command__field tz-command__field--grow">
<label class="tz-command__label" for="filter_search">Поиск</label>
<input type="text" name="filter_search" id="filter_search" class="tz-command__input" placeholder="Должность, навык…" value="">
</div>
<div class="tz-command__field tz-command__field--btns">
<span class="tz-command__label tz-command__label--hide">Действия</span>
<div class="tz-command__btns">
<button class="tz-btn tz-btn--glow" id="jobokay_search_submit" type="submit">Найти</button>
<button class="tz-btn tz-btn--line tz-btn--sm" id="jobokay_search_clear" type="button" title="Очистить" onclick="document.getElementById('filter_search').value='';this.form.submit();">×</button>
</div>
</div>
</div>
</form>
</div>
</div>
</div>
