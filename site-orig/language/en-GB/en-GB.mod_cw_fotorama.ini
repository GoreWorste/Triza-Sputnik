MOD_CW_FOTORAMA_DATA_FIT_DESC="There are 4 ways to fit an image/thumbnail into a fotorama:<br><br>
    'contain' Default - Stretching the image to be fully displayed while fitting within the fotorama.<br><br>
    'cover' Default for thumbnails - Stretching and cropping the image to completely cover the fotorama.<br><br>
    'scaledown' - Stretching the image if it is bigger than the fotorama.<br><br>
    'none' - Using the image’s own dimensions."
