MOD_K2_CONTENT="Контент К2"
K2_MOD_K2_CONTENT_DESCRIPTION="Контент K2 является основным «содержанием» поискового модуля для K2. Вы можете установить разные категории и фильтры элементов материалов для отображения числа элементов, поступающих из компонента K2. При использовании нескольких копий этого модуля (с различными настройками) создаются  макеты  комплексных веб-страниц для публикации новостей /журналов."
