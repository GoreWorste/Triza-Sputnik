MOD_K2_USERS="Пользователи К2"
K2_MOD_K2_USERS_DESCRTIPTION="Этот модуль использует переопределения шаблона MVC. Это означает, что вы можете создать новую папку вложенного подшаблона для этого модуля в папке /html/mod k2 users/ вашего  шаблона Joomla. Модуль будет забирать новый вложенный шаблон волшебно автоматически, без редактирования любого файла XML или делать любую другую не дизайнерскую работу!"
